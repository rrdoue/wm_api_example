[project]
name = "wm-api-example"
version = "0.1.0"
description = "Sample webMethods api project that implements webMethods integration server package import functionality."
authors = [
    { name = "Ray Doue", email = "rrdoue@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "backports-datetime-fromisoformat==2.0.3",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.9",
    "environs==15.0.1",
    "idna==3.18",
    "marshmallow==4.3.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
